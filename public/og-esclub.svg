<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0b14"/>
      <stop offset="55%" stop-color="#12142a"/>
      <stop offset="100%" stop-color="#1a1040"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#6eda2c" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#6eda2c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6eda2c"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- marca oficial: quadrado "on" -->
  <g transform="translate(80,74)">
    <rect width="72" height="72" rx="16" fill="#6ED42A"/>
    <text x="36" y="52" font-family="'Nunito','Varela Round','Arial Rounded MT Bold',sans-serif"
      font-size="38" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-1">on</text>
  </g>
  <text x="172" y="126" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
    font-size="30" font-weight="700" fill="#8890b5" letter-spacing="0.5">Tráfeg.on</text>

  <!-- título -->
  <text x="80" y="330" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
    font-size="86" font-weight="900" fill="#ffffff" letter-spacing="-2.5">ES Club</text>
  <text x="80" y="440" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
    font-size="86" font-weight="900" fill="url(#accent)" letter-spacing="-2.5">Tráfego pago</text>

  <!-- slogan -->
  <text x="80" y="520" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
    font-size="30" font-weight="400" fill="#8890b5"><tspan font-weight="900" fill="#6eda2c">Tráfegon</tspan><tspan fill="#3f4463" xml:space="preserve">&#160;—&#160;</tspan>Gerando negócios para o <tspan font-weight="800" fill="#ffffff">seu negócio</tspan></text>

  <rect x="80" y="556" width="90" height="5" rx="3" fill="url(#accent)"/>
</svg>
