name: Sync Metrics

on:
  schedule:
    - cron: '0 11 * * *'  # 08:00 BRT (11:00 UTC)
    - cron: '0 15 * * *'  # 12:00 BRT (15:00 UTC)
  workflow_dispatch:       # permite rodar manualmente pelo GitHub

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sincronizar métricas Windsor.ai
        env:
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
        run: node scripts/sync-metrics.js

      - name: Commit e push se houver mudanças
        run: |
          git config user.name  "sync-bot"
          git config user.email "sync@trafegon.com.br"
          git add src/data/ads-metrics.js
          git diff --cached --quiet || git commit -m "chore: atualiza métricas de período [$(date +%Y-%m-%d)]"
          git push
